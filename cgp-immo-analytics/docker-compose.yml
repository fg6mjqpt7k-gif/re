version: "3.9"

services:
  # ===========================================
  # PostgreSQL + PostGIS
  # ===========================================
  db:
    image: postgis/postgis:16-3.4
    container_name: cgp-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: cgp_immo
      POSTGRES_USER: cgp_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme_in_production}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./data/seed/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cgp_admin -d cgp_immo"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================
  # FastAPI Backend
  # ===========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cgp-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://cgp_admin:${DB_PASSWORD:-changeme_in_production}@db:5432/cgp_immo
      DATABASE_URL_SYNC: postgresql://cgp_admin:${DB_PASSWORD:-changeme_in_production}@db:5432/cgp_immo
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
      SECRET_KEY: ${SECRET_KEY:-changeme_in_production}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy

  # ===========================================
  # Next.js Frontend
  # ===========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cgp-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    depends_on:
      - backend

  # ===========================================
  # Nginx Reverse Proxy
  # ===========================================
  nginx:
    image: nginx:alpine
    container_name: cgp-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend

volumes:
  pgdata:
    driver: local
